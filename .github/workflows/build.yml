name: Build APKs

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Build with Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: Copy and rename APKs
        run: |
          mkdir -p release-apks
          cp wear/build/outputs/apk/debug/*-debug.apk release-apks/wakescience-galaxy-watch.apk
          cp app/build/outputs/apk/debug/*-debug.apk release-apks/wakescience-phone.apk
          ls -la release-apks/

      - name: Upload APKs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wakescience-apks
          path: release-apks/*.apk
